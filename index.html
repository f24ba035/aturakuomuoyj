<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上毛かるた マスター</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app" class="app-container">
        <!-- Header -->
        <header class="glass-header">
            <h1>上毛かるた <span>マスター</span></h1>
            <div class="header-actions">
                <button id="settings-btn" class="icon-btn" aria-label="出題設定" title="出題かるた設定">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </button>
                <button id="stats-btn" class="icon-btn" aria-label="学習記録" title="学習記録を見る">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 20h9"></path>
                        <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Main Content (Game View) -->
        <main id="game-view" class="view active">
            
            <div class="progress-bar-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
            
            <div class="score-board">
                <div class="score-item">
                    <span class="label">学習中</span>
                    <span id="current-count" class="value">1 / 44</span>
                </div>
                <div class="score-item">
                    <span class="label">覚えた!</span>
                    <span id="score-count" class="value success">0</span>
                </div>
            </div>

            <!-- Card Container -->
            <div class="card-area">
                <div id="flashcard" class="flashcard">
                    <div class="card-inner">
                        <div class="card-front">
                            <h2 id="card-initial" class="initial-letter">あ</h2>
                            <p class="hint">タップして続きを見る</p>
                        </div>
                        <div class="card-back">
                            <h2 id="card-initial-back" class="initial-letter-small">あ</h2>
                            <p id="card-text" class="full-text">浅間のいたずら 鬼の押出し</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Controls (Appears after flipping) -->
            <div id="controls" class="controls hidden">
                <button id="btn-forgot" class="btn btn-danger">
                    <span>忘れていた</span>
                </button>
                <button id="btn-remembered" class="btn btn-success">
                    <span>覚えていた！</span>
                </button>
            </div>

            <div id="start-screen" class="overlay active">
                <div class="modal glass-modal">
                    <h2>上毛かるた学習を始めますか？</h2>
                    <p>最初の文字を見て、続く言葉を思い浮かべましょう。</p>
                    <button id="btn-start" class="btn btn-primary btn-large">学習をスタート</button>
                </div>
            </div>

            <div id="result-screen" class="overlay hidden">
                <div class="modal glass-modal result-modal">
                    <h2>学習完了！</h2>
                    <div class="result-score">
                        <span id="final-score" class="score-number">44</span>
                        <span class="score-max">/ 44</span>
                    </div>
                    <p id="result-message" class="result-message">素晴らしい！</p>
                    <div class="result-actions">
                        <button id="btn-restart" class="btn btn-primary">もう一度学習する</button>
                        <button id="btn-view-stats" class="btn btn-secondary">これまでの記録</button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Stats View -->
        <main id="stats-view" class="view hidden">
            <div class="stats-header">
                <h2>学習記録</h2>
                <button id="btn-back" class="icon-btn back-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                    戻る
                </button>
            </div>
            
            <div class="stats-overview">
                <div class="stat-card">
                    <h3>学習回数</h3>
                    <p id="stat-total-sessions" class="stat-value">0</p>
                </div>
                <div class="stat-card">
                    <h3>最高スコア</h3>
                    <p id="stat-high-score" class="stat-value">0</p>
                </div>
            </div>

            <div class="history-list-container">
                <h3>過去の記録</h3>
                <ul id="history-list" class="history-list">
                    <!-- History items will be inserted here by JS -->
                </ul>
                <div id="empty-history" class="empty-state">
                    <p>まだ記録がありません。<br>学習を始めて記録を残しましょう！</p>
                </div>
            </div>
        </main>

        <!-- Settings View -->
        <main id="settings-view" class="view hidden">
            <div class="stats-header">
                <h2>出題札の設定</h2>
                <button id="btn-settings-back" class="icon-btn back-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                    戻る
                </button>
            </div>

            <div class="settings-toolbar">
                <span id="selected-count-badge" class="count-badge">選択中: 44 / 44枚</span>
                <div class="bulk-buttons">
                    <button id="btn-select-all" class="btn-chip">全選択 (+)</button>
                    <button id="btn-deselect-all" class="btn-chip btn-chip-secondary">全解除 (ー)</button>
                </div>
            </div>

            <div class="settings-card-list" id="settings-card-list">
                <!-- Card items with +/- toggle will be populated by JS -->
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
